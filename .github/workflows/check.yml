# Schnellprüfung als PR-Check. Öffentliches Repo: Standard-Linux-Runner kosten keine Minuten (das 2.000-Minuten-Kontingent
# gilt nur für private Repos) - globale Regel "GitHub Actions sparsam" (cubeescape-rules 1.15). Führt genau die Befehle aus
# `.ce-repo.json` › check.quick aus, die eine Sitzung mit ./check lokal laufen lässt; Blender-, Bild- und Mac-Stufen bleiben
# beim Nachtlauf auf dem Mac. Push nur auf main, andere Branches über ihren Pull Request, Doku löst nichts aus.
name: check

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "Docs/**", ".claude/**", ".agents/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "Docs/**", ".claude/**", ".agents/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .ce-repo.json
      - name: Abhängigkeiten
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install numpy
      - name: check.quick aus .ce-repo.json
        run: ./ce check
